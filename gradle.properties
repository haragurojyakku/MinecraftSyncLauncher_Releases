# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# Project
group=dev.haraguro.modserverplaymanager
version=0.6.3

# Minecraft / Fabric (mod module)
# Source: https://meta.fabricmc.net/v2/versions/game, /loader, and Modrinth fabric-api,
# checked 2026-07-25. No Yarn mappings are published yet for 26.2, so the mod module
# uses Mojang's official mappings instead (loom.officialMojangMappings()).
minecraft_version=26.2
fabric_loader_version=0.19.3
fabric_api_version=0.155.2+26.2
loom_version=1.17.17

# Minecraft 26.2 requires Java 25 (java-runtime-epsilon) per Mojang's piston-meta.
java_version=25
